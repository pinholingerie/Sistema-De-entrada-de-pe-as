<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --purple:#3C3489;--purple-light:#EEEDFE;--purple-mid:#7F77DD;
    --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#1D9E75;
    --amber:#854F0B;--amber-light:#FAEEDA;--amber-mid:#BA7517;
    --red:#A32D2D;--red-light:#FCEBEB;--red-mid:#E24B4A;
    --gray:#5F5E5A;--gray-light:#F1EFE8;--gray-border:#D3D1C7;
    --bg:#f7f7f5;--card:#ffffff;--text:#1a1a18;--text-muted:#5F5E5A;
    --radius:10px;--radius-lg:14px;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
  
  #app{display:flex;flex-direction:column;min-height:100vh}
  
  /* Header */
  .topbar{background:var(--purple);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar h1{font-size:17px;font-weight:500;letter-spacing:-.2px}
  .topbar-sub{font-size:12px;opacity:.7;margin-top:1px}
  .btn-config{background:rgba(255,255,255,.15);border:none;color:white;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
  
  /* Nav */
  nav{background:var(--card);border-bottom:1px solid var(--gray-border);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:65px;z-index:99}
  nav::-webkit-scrollbar{display:none}
  .nav-btn{background:none;border:none;padding:12px 16px;font-size:13px;color:var(--text-muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}
  .nav-btn.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:500}
  
  /* Main */
  main{flex:1;padding:16px;max-width:800px;margin:0 auto;width:100%}
  
  /* Cards */
  .card{background:var(--card);border-radius:var(--radius-lg);border:0.5px solid var(--gray-border);padding:16px;margin-bottom:12px}
  .card-title{font-size:13px;color:var(--text-muted);margin-bottom:12px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
  
  /* Stat grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--gray-light);border-radius:var(--radius);padding:12px 14px}
  .stat-label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
  .stat-value{font-size:22px;font-weight:500}
  .stat-value.red{color:var(--red)}
  .stat-value.teal{color:var(--teal)}
  .stat-value.purple{color:var(--purple)}
  .stat-value.amber{color:var(--amber)}
  
  /* Forms */
  .form-group{margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--gray-border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:.2s;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--purple-mid);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
  textarea{resize:vertical;min-height:70px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  
  /* Buttons */
  .btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:.15s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--purple);color:white}
  .btn-primary:hover{background:#534AB7}
  .btn-secondary{background:var(--gray-light);color:var(--text)}
  .btn-secondary:hover{background:var(--gray-border)}
  .btn-teal{background:var(--teal);color:white}
  .btn-teal:hover{background:#0F6E56}
  .btn-danger{background:var(--red-light);color:var(--red)}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn-full{width:100%}
  
  /* Table */
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:0.5px solid var(--gray-border)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--gray-light);padding:9px 12px;text-align:left;font-weight:500;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td{padding:9px 12px;border-top:0.5px solid var(--gray-border)}
  tr:hover td{background:var(--gray-light)}
  
  /* Badge */
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
  .badge-teal{background:var(--teal-light);color:var(--teal)}
  .badge-red{background:var(--red-light);color:var(--red)}
  .badge-amber{background:var(--amber-light);color:var(--amber)}
  .badge-purple{background:var(--purple-light);color:var(--purple)}
  
  /* Alert */
  .alert{padding:12px 14px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;display:flex;align-items:flex-start;gap:8px}
  .alert-info{background:var(--purple-light);color:var(--purple)}
  .alert-success{background:var(--teal-light);color:var(--teal)}
  .alert-warn{background:var(--amber-light);color:var(--amber)}
  .alert-danger{background:var(--red-light);color:var(--red)}
  
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border-radius:var(--radius-lg);padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .modal-title{font-size:16px;font-weight:500}
  .btn-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .btn-close:hover{background:var(--gray-light)}
  
  /* Empty state */
  .empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
  .empty-icon{font-size:36px;margin-bottom:10px}
  .empty p{font-size:14px;margin-bottom:14px}
  
  /* Config screen */
  #screen-config{padding:0}
  .config-section{margin-bottom:24px}
  .config-section h3{font-size:14px;font-weight:500;margin-bottom:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
  
  /* Saldo row */
  .oficina-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--gray-border)}
  .oficina-row:last-child{border-bottom:none}
  .oficina-nome{font-weight:500;font-size:14px}
  .oficina-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
  .saldo-val{font-size:16px;font-weight:500}
  
  /* Upload area */
  .upload-area{border:2px dashed var(--gray-border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:.2s}
  .upload-area:hover{border-color:var(--purple-mid);background:var(--purple-light)}
  .upload-area input{display:none}
  
  /* Loading */
  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a18;color:white;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  
  @media(max-width:480px){
    .form-row{grid-template-columns:1fr}
    main{padding:12px}
    .topbar{padding:12px 16px}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar h1" style="font-size:17px;font-weight:500">🧵 Controle de Produção</div>
      <div class="topbar-sub" id="topbar-sub">Conectar ao Google Sheets</div>
    </div>
    <button class="btn-config" onclick="openConfig()" title="Configurações">⚙</button>
  </div>
  
  <nav>
    <button class="nav-btn active" onclick="goTo('dashboard')">Dashboard</button>
    <button class="nav-btn" onclick="goTo('producao')">Entrada de produção</button>
    <button class="nav-btn" onclick="goTo('pagamentos')">Pagamentos</button>
    <button class="nav-btn" onclick="goTo('oficinas')">Oficinas</button>
    <button class="nav-btn" onclick="goTo('produtos')">Produtos</button>
    <button class="nav-btn" onclick="goTo('historico')">Histórico</button>
    <button class="nav-btn" onclick="goTo('importar')">Importar</button>
  </nav>
  
  <main id="main-content"></main>
</div>

<!-- Modal genérico -->
<div class="modal-bg" id="modal">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ═══════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════
let GAS_URL = localStorage.getItem('gas_url') || '';
let currentScreen = 'dashboard';

// Cache local (fallback offline)
let state = {
  oficinas: JSON.parse(localStorage.getItem('oficinas') || '[]'),
  produtos: JSON.parse(localStorage.getItem('produtos') || '[]'),
  producao: JSON.parse(localStorage.getItem('producao') || '[]'),
  pagamentos: JSON.parse(localStorage.getItem('pagamentos') || '[]'),
};

function saveLocal() {
  localStorage.setItem('oficinas', JSON.stringify(state.oficinas));
  localStorage.setItem('produtos', JSON.stringify(state.produtos));
  localStorage.setItem('producao', JSON.stringify(state.producao));
  localStorage.setItem('pagamentos', JSON.stringify(state.pagamentos));
}

// ═══════════════════════════════════════
// API GOOGLE APPS SCRIPT
// ═══════════════════════════════════════
async function api(action, data={}) {
  if (!GAS_URL) { toast('Configure a URL do Apps Script primeiro', 'warn'); return null; }
  try {
    const r = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({action, ...data}),
    });
    const json = await r.json();
    if (json.error) throw new Error(json.error);
    return json;
  } catch(e) {
    toast('Erro na conexão: ' + e.message, 'danger');
    return null;
  }
}

async function syncAll() {
  if (!GAS_URL) return;
  const r = await api('getAll');
  if (!r) return;
  state.oficinas = r.oficinas || state.oficinas;
  state.produtos = r.produtos || state.produtos;
  state.producao = r.producao || state.producao;
  state.pagamentos = r.pagamentos || state.pagamentos;
  saveLocal();
  document.getElementById('topbar-sub').textContent = 'Sincronizado agora';
  renderScreen(currentScreen);
}

// ═══════════════════════════════════════
// NAV
// ═══════════════════════════════════════
function goTo(screen) {
  currentScreen = screen;
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    const screens = ['dashboard','producao','pagamentos','oficinas','produtos','historico','importar'];
    b.classList.toggle('active', screens[i] === screen);
  });
  renderScreen(screen);
}

function renderScreen(screen) {
  const el = document.getElementById('main-content');
  const renders = {
    dashboard: renderDashboard,
    producao: renderProducao,
    pagamentos: renderPagamentos,
    oficinas: renderOficinas,
    produtos: renderProdutos,
    historico: renderHistorico,
    importar: renderImportar,
  };
  if (renders[screen]) el.innerHTML = renders[screen]();
  else el.innerHTML = '<p>Tela não encontrada</p>';
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtN = v => Number(v||0).toLocaleString('pt-BR');
function now() { return new Date().toLocaleDateString('pt-BR'); }
function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function getOficina(id) { return state.oficinas.find(o=>o.id===id) || {nome:'?'}; }
function getProduto(id) { return state.produtos.find(p=>p.id===id) || {nome:'?', valor:0}; }

function saldoOficina(id) {
  const prod = state.producao.filter(p=>p.oficina_id===id).reduce((s,p)=>{
    const prod = getProduto(p.produto_id);
    return s + (Number(p.quantidade)||0) * (Number(prod.valor)||0);
  }, 0);
  const pago = state.pagamentos.filter(p=>p.oficina_id===id).reduce((s,p)=>s+(Number(p.valor)||0), 0);
  return prod - pago;
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type === 'success' ? '#0F6E56' : type === 'danger' ? '#A32D2D' : '#854F0B';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

// ═══════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════
function renderDashboard() {
  const totalProd = state.producao.reduce((s,p)=>{
    const prod = getProduto(p.produto_id);
    return s + (Number(p.quantidade)||0) * (Number(prod.valor)||0);
  }, 0);
  const totalPago = state.pagamentos.reduce((s,p)=>s+(Number(p.valor)||0), 0);
  const totalDever = totalProd - totalPago;
  const totalPecas = state.producao.reduce((s,p)=>s+(Number(p.quantidade)||0), 0);

  const saldosOficinas = state.oficinas.map(o=>({
    ...o, saldo: saldoOficina(o.id)
  })).sort((a,b)=>b.saldo-a.saldo);

  const recentes = [...state.producao].sort((a,b)=>b.id?.localeCompare?.(a.id)||0).slice(0,5);

  return `
  <div class="stats">
    <div class="stat"><div class="stat-label">Total a pagar</div><div class="stat-value red">${fmt(totalDever)}</div></div>
    <div class="stat"><div class="stat-label">Total produzido</div><div class="stat-value purple">${fmt(totalProd)}</div></div>
    <div class="stat"><div class="stat-label">Total pago</div><div class="stat-value teal">${fmt(totalPago)}</div></div>
    <div class="stat"><div class="stat-label">Peças produzidas</div><div class="stat-value amber">${fmtN(totalPecas)}</div></div>
  </div>

  <div class="card">
    <div class="card-title">Saldo por oficina</div>
    ${saldosOficinas.length === 0 ? '<div class="empty"><div class="empty-icon">🏭</div><p>Nenhuma oficina cadastrada ainda</p><button class="btn btn-primary" onclick="goTo(\'oficinas\')">Cadastrar oficina</button></div>' :
      saldosOficinas.map(o=>`
      <div class="oficina-row">
        <div>
          <div class="oficina-nome">${o.nome}</div>
          <div class="oficina-meta">${o.cidade||''}</div>
        </div>
        <div style="text-align:right">
          <div class="saldo-val ${o.saldo>0?'red':o.saldo<0?'teal':'gray'}">${fmt(o.saldo)}</div>
          <div style="font-size:11px;color:var(--text-muted)">${o.saldo>0?'a pagar':o.saldo<0?'a receber':'em dia'}</div>
        </div>
      </div>`).join('')
    }
  </div>

  ${recentes.length > 0 ? `
  <div class="card">
    <div class="card-title">Últimas entradas</div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Data</th><th>Oficina</th><th>Produto</th><th>Qtd</th><th>Valor</th></tr></thead>
      <tbody>${recentes.map(p=>{
        const prod = getProduto(p.produto_id);
        return `<tr>
          <td>${p.data||'-'}</td>
          <td>${getOficina(p.oficina_id).nome}</td>
          <td>${prod.nome}</td>
          <td>${fmtN(p.quantidade)}</td>
          <td>${fmt((Number(p.quantidade)||0)*(Number(prod.valor)||0))}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    </div>
  </div>` : ''}

  <button class="btn btn-secondary btn-full" onclick="syncAll()" style="margin-top:4px">🔄 Sincronizar com Google Sheets</button>
  `;
}

// ═══════════════════════════════════════
// ENTRADA DE PRODUÇÃO
// ═══════════════════════════════════════
function renderProducao() {
  if (state.oficinas.length === 0 || state.produtos.length === 0) {
    return `<div class="alert alert-warn">⚠️ Cadastre pelo menos uma oficina e um produto antes de lançar produção.</div>
    <div style="display:flex;gap:10px"><button class="btn btn-primary" onclick="goTo('oficinas')">Cadastrar oficina</button><button class="btn btn-secondary" onclick="goTo('produtos')">Cadastrar produto</button></div>`;
  }

  const entradas = [...state.producao].reverse().slice(0,50);

  return `
  <div class="card">
    <div class="card-title">Nova entrada de produção</div>
    <div class="form-group">
      <label>Oficina</label>
      <select id="p-oficina" onchange="calcValor()">
        <option value="">Selecione a oficina...</option>
        ${state.oficinas.map(o=>`<option value="${o.id}">${o.nome}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>Produto</label>
      <select id="p-produto" onchange="calcValor()">
        <option value="">Selecione o produto...</option>
        ${state.produtos.map(p=>`<option value="${p.id}" data-valor="${p.valor}">${p.nome} — ${fmt(p.valor)}/un</option>`).join('')}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Quantidade</label>
        <input type="number" id="p-qtd" placeholder="0" min="1" oninput="calcValor()">
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="p-data" value="${new Date().toISOString().split('T')[0]}">
      </div>
    </div>
    <div class="form-group">
      <label>Valor total calculado</label>
      <div id="p-total" style="font-size:20px;font-weight:500;color:var(--purple);padding:8px 0">R$ 0,00</div>
    </div>
    <div class="form-group">
      <label>Observação (opcional)</label>
      <textarea id="p-obs" placeholder="Ex: lote com defeito, urgente..."></textarea>
    </div>
    <button class="btn btn-primary btn-full" onclick="salvarProducao()">Registrar entrada</button>
  </div>

  ${entradas.length > 0 ? `
  <div class="card">
    <div class="card-title">Entradas recentes</div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Data</th><th>Oficina</th><th>Produto</th><th>Qtd</th><th>Valor</th><th></th></tr></thead>
      <tbody>${entradas.map(p=>{
        const prod = getProduto(p.produto_id);
        const val = (Number(p.quantidade)||0)*(Number(prod.valor)||0);
        return `<tr>
          <td>${p.data||'-'}</td>
          <td>${getOficina(p.oficina_id).nome}</td>
          <td>${prod.nome}</td>
          <td>${fmtN(p.quantidade)}</td>
          <td>${fmt(val)}</td>
          <td><button class="btn btn-danger btn-sm" onclick="excluirProducao('${p.id}')">✕</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    </div>
  </div>` : ''}
  `;
}

function calcValor() {
  const sel = document.getElementById('p-produto');
  const qtd = Number(document.getElementById('p-qtd')?.value || 0);
  const val = Number(sel?.selectedOptions[0]?.dataset?.valor || 0);
  const total = document.getElementById('p-total');
  if (total) total.textContent = fmt(qtd * val);
}

async function salvarProducao() {

        </select>
      </div>

        <label>Período</label>
        <select id="h-periodo" onchange="filtrarHistorico()">
          <option value="todos">Todos</option>
          <option value="mes">Este mês</option>
          <option value="90">Últimos 90 dias</option>
        </select>
      </div>
    </div>
  </div>

  <div id="historico-resultado"></div>
  <script>filtrarHistorico()<\/script>
  `;

function filtrarHistorico() {
  const ofId = document.getElementById('h-oficina')?.value;
  const periodo = document.getElementById('h-periodo')?.value;
  const el = document.getElementById('historico-resultado');
  if (!el) return;

  let prod = [...state.producao];
  let pag = [...state.pagamentos];

  if (ofId) { prod = prod.filter(p=>p.oficina_id===ofId); pag = pag.filter(p=>p.oficina_id===ofId); }

  const agora = new Date();
  if (periodo === 'mes') {
    const ini = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString().split('T')[0];
    prod = prod.filter(p=>p.data>=ini); pag = pag.filter(p=>p.data>=ini);
  } else if (periodo === '90') {
    const ini = new Date(agora - 90*864e5).toISOString().split('T')[0];
    prod = prod.filter(p=>p.data>=ini); pag = pag.filter(p=>p.data>=ini);
  }

  const totalProd = prod.reduce((s,p)=>{
    const pr = getProduto(p.produto_id);
    return s + (Number(p.quantidade)||0)*(Number(pr.valor)||0);
  }, 0);
  const totalPag = pag.reduce((s,p)=>s+(Number(p.valor)||0), 0);

  const rows = [
    ...prod.map(p=>{ const pr=getProduto(p.produto_id); return {data:p.data,tipo:'Produção',desc:`${getOficina(p.oficina_id).nome} — ${pr.nome} x${fmtN(p.quantidade)}`,valor:(Number(p.quantidade)||0)*(Number(pr.valor)||0),badge:'badge-purple',label:'Produção'}; }),
    ...pag.map(p=>({data:p.data,tipo:'Pagamento',desc:`${getOficina(p.oficina_id).nome} (${p.forma||''})`,valor:p.valor,badge:'badge-teal',label:'Pagamento'})),
  ].sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  el.innerHTML = `
  <div class="stats">
    <div class="stat"><div class="stat-label">Produção no período</div><div class="stat-value purple">${fmt(totalProd)}</div></div>
    <div class="stat"><div class="stat-label">Pagamentos no período</div><div class="stat-value teal">${fmt(totalPag)}</div></div>
    <div class="stat"><div class="stat-label">Saldo período</div><div class="stat-value ${totalProd-totalPag>0?'red':'teal'}">${fmt(totalProd-totalPag)}</div></div>
  </div>
  ${rows.length === 0 ? '<div class="empty"><div class="empty-icon">📋</div><p>Nenhum registro encontrado</p></div>' : `
  <div class="card">
    <div class="table-wrap">
    <table>
      <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr></thead>
      <tbody>${rows.slice(0,100).map(r=>`<tr>
        <td>${r.data||'—'}</td>
        <td><span class="badge ${r.badge}">${r.label}</span></td>
        <td>${r.desc}</td>
        <td style="font-weight:500">${fmt(r.valor)}</td>
      </tr>`).join('')}</tbody>
    </table>
    </div>
  </div>`}
  `;
}

function lerXLSX(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {defval:''});
      res(data);
    };
    reader.onerror = rej;
    reader.readAsBinaryString(file);
  });
}

async function importarProducao(input) {
  const file = input.files[0]; if (!file) return;
  const el = document.getElementById('import-prod-result');
  el.innerHTML = '<div class="alert alert-info">Processando...</div>';
  try {
    const rows = await lerXLSX(file);
    let ok=0, erros=[];
    for (const row of rows) {
      const ofNome = row['oficina_nome'] || row['oficina'] || row['Oficina'];
      const prNome = row['produto_nome'] || row['produto'] || row['Produto'];
      const qtd = Number(row['quantidade'] || row['Quantidade'] || 0);
      const data = String(row['data'] || row['Data'] || '');

      const of = state.oficinas.find(o=>o.nome.toLowerCase()===String(ofNome).toLowerCase());
      let pr = state.produtos.find(p=>p.nome.toLowerCase()===String(prNome).toLowerCase());

      if (!of) { erros.push(`Oficina não encontrada: "${ofNome}"`); continue; }
      if (!pr) {
        // Cria produto automaticamente sem valor
        pr = { id: uuid(), nome: String(prNome), valor: 0, categoria:'Outro', tamanho:'', ref:'' };
        state.produtos.push(pr);
      }
      state.producao.push({ id: uuid(), oficina_id: of.id, produto_id: pr.id, quantidade: qtd, data, obs:'Importado' });
      ok++;
    }
    saveLocal();
    const erroHtml = erros.length ? `<div class="alert alert-warn" style="margin-top:8px">⚠️ ${erros.slice(0,5).join('<br>')}</div>` : '';
    el.innerHTML = `<div class="alert alert-success">✓ ${ok} entradas importadas</div>${erroHtml}`;
    if (ok > 0) toast(`${ok} entradas importadas ✓`);
  } catch(e) {
    el.innerHTML = `<div class="alert alert-danger">Erro ao ler arquivo: ${e.message}</div>`;
  }
}

async function importarPagamentos(input) {
  const file = input.files[0]; if (!file) return;
  const el = document.getElementById('import-pag-result');
  el.innerHTML = '<div class="alert alert-info">Processando...</div>';
  try {
    const rows = await lerXLSX(file);
    let ok=0, erros=[];
    for (const row of rows) {
      const ofNome = row['oficina_nome'] || row['oficina'] || row['Oficina'];
      const valor = Number(row['valor'] || row['Valor'] || 0);
      const data = String(row['data'] || row['Data'] || '');
      const forma = String(row['forma'] || row['Forma'] || 'Pix');

      const of = state.oficinas.find(o=>o.nome.toLowerCase()===String(ofNome).toLowerCase());
      if (!of) { erros.push(`Oficina não encontrada: "${ofNome}"`); continue; }
      state.pagamentos.push({ id: uuid(), oficina_id: of.id, valor, data, forma, obs:'Importado' });
      ok++;
    }
    saveLocal();
    el.innerHTML = `<div class="alert alert-success">✓ ${ok} pagamentos importados</div>`;
    if (ok > 0) toast(`${ok} pagamentos importados ✓`);
  } catch(e) {
    el.innerHTML = `<div class="alert alert-danger">Erro: ${e.message}</div>`;
  }
}

async function importarOficinas(input) {
  const file = input.files[0]; if (!file) return;
  const el = document.getElementById('import-of-result');
  el.innerHTML = '<div class="alert alert-info">Processando...</div>';
  try {
    const rows = await lerXLSX(file);
    let ok=0;
    for (const row of rows) {
      const nome = String(row['nome'] || row['Nome'] || '').trim();
      if (!nome) continue;
      if (state.oficinas.find(o=>o.nome.toLowerCase()===nome.toLowerCase())) continue;
      state.oficinas.push({
        id: uuid(),
        nome,
        responsavel: row['responsavel'] || row['Responsável'] || '',
        telefone: row['telefone'] || row['Telefone'] || '',
        cidade: row['cidade'] || row['Cidade'] || '',
        pix: row['pix'] || row['Pix'] || '',
      });
      ok++;
    }
    saveLocal();
    el.innerHTML = `<div class="alert alert-success">✓ ${ok} oficinas importadas</div>`;
    if (ok > 0) toast(`${ok} oficinas importadas ✓`);
  } catch(e) {
    el.innerHTML = `<div class="alert alert-danger">Erro: ${e.message}</div>`;
  }
}

function exportarTudo() {
  const wb = XLSX.utils.book_new();

  const ofData = state.oficinas.map(o=>({Nome:o.nome,Responsável:o.responsavel,Telefone:o.telefone,Cidade:o.cidade,Pix:o.pix,Saldo:saldoOficina(o.id)}));
  const prData = state.produtos.map(p=>({Nome:p.nome,Categoria:p.categoria,Tamanho:p.tamanho,Referência:p.ref,'Valor/un':p.valor}));
  const prodData = state.producao.map(p=>{ const pr=getProduto(p.produto_id); return {Data:p.data,Oficina:getOficina(p.oficina_id).nome,Produto:pr.nome,Quantidade:p.quantidade,ValorUnit:pr.valor,ValorTotal:(Number(p.quantidade)||0)*(Number(pr.valor)||0),Obs:p.obs}; });
  const pagData = state.pagamentos.map(p=>({Data:p.data,Oficina:getOficina(p.oficina_id).nome,Valor:p.valor,Forma:p.forma,Obs:p.obs}));

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ofData), 'Oficinas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prData), 'Produtos');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodData), 'Producao');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pagData), 'Pagamentos');
  XLSX.writeFile(wb, `backup-producao-${new Date().toISOString().split('T')[0]}.xlsx`);
  toast('Backup exportado ✓');
}

      ${state.oficinas.length} oficinas · ${state.produtos.length} produtos · ${state.producao.length} entradas · ${state.pagamentos.length} pagamentos

}

async function salvarConfig() {
  const url = document.getElementById('cfg-url').value.trim();
  GAS_URL = url;
  localStorage.setItem('gas_url', url);
  closeModal();
  if (url) {
    toast('Testando conexão...');
    await syncAll();
  } else {
    toast('URL removida — modo offline ativo');
  }
}

function limparDados() {
  if (!confirm('Limpar TODOS os dados locais? Esta ação não pode ser desfeita.')) return;
  state = { oficinas:[], produtos:[], producao:[], pagamentos:[] };
  saveLocal();
  closeModal();
  toast('Dados locais limpos');
  renderScreen(currentScreen);
}
